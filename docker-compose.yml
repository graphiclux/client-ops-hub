version: "3.9"

services:
  traefik:
    image: traefik:v3.1
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - app_uploads:/data/uploads
    labels:
      - traefik.enable=true
      - traefik.http.routers.clientops.rule=Host(`clients.graphiclux.com`)
      - traefik.http.routers.clientops.entrypoints=websecure
      - traefik.http.routers.clientops.tls.certresolver=letsencrypt
      - traefik.http.services.clientops.loadbalancer.server.port=3000
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "worker"]
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:1.32.5
    environment:
      DOMAIN: https://vault.graphiclux.com
      SIGNUPS_ALLOWED: "false"
    volumes:
      - vaultwarden_data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.vault.rule=Host(`vault.graphiclux.com`)
      - traefik.http.routers.vault.entrypoints=websecure
      - traefik.http.routers.vault.tls.certresolver=letsencrypt
      - traefik.http.services.vault.loadbalancer.server.port=80
    restart: unless-stopped

volumes:
  traefik_letsencrypt:
  postgres_data:
  redis_data:
  vaultwarden_data:
  app_uploads:
